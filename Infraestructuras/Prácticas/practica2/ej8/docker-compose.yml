services:
  database:
    image: postgres:15
    container_name: blog-database
    environment:
      POSTGRES_DB: blogdb
      POSTGRES_USER: bloguser
      POSTGRES_PASSWORD: blogpass
    networks:
      - database_net
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis: 
    image: redis:alpine
    container_name: blog-redis
    networks:
      - application_net
    volumes:
      - redis_data:/data
  backend:
    build: ./backend
    container_name: blog-backend
    networks:
      - database_net
      - application_net
    depends_on:
      - redis
      - database
  nginx:
    image: nginx:alpine
    container_name: blog-frontend
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/html:/usr/share/nginx/html:ro
    networks:
      - public_net
      - application_net
    depends_on:
      - backend
networks:
  database_net:
  public_net:
  application_net:
volumes:
  postgres_data:
  redis_data: