services:
  db:
    image: postgres:15
    container_name: mi-postgres
    environment:
      - POSTGRES_PASSWORD=secretpassword   
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 3 
  web:
    image: adminer
    container_name: mi-adminer
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy