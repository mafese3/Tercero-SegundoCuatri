services:
  database:
    image: postgres:15
    container_name: db-backend
    environment:
      POSTGRES_DB: mydb
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    networks:
      - backend
    volumes:
      - db_data:/var/lib/postgresql/data
  api:
    build: ./api
    container_name: api-service
    networks:
      - frontend
      - backend
    depends_on:
      - database
  nginx:
    image: nginx:alpine
    container_name: nginx-frontend
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - frontend
    depends_on:
      - api
networks:
  frontend:
  backend:
volumes:
  db_data: