<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <article>
        <h1>Este es el encabezado 1</h1>
        <p>Este es el párrafo de la descripción del tema principal</p>
        
        <h2>Esto es el encabezado 2</h2>
        <p>Este párrafo es el contenido despues del encabezado 2</p>
        <blockquote cite="https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/q">
            Esto es una cita
        </blockquote>

        <h3>Este es el encabezado 3</h3>
        <p>Y este es el último párrafo del artículo <q>que incluye una cita</q> </p>

    </article>
</body>
</html>
